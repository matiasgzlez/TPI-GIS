# Visor A.3 (demo): sirve el build de Vite (web/dist) y hace de proxy a GeoServer en el mismo origen (sin CORS).

# Caché de teselas y leyendas WMS: GeoServer tarda en dibujar y las mismas teselas se piden una y otra
# vez al navegar. Las consultas (WFS, GetFeatureInfo) y el WFS-T no pasan por acá.
proxy_cache_path /tmp/cache-wms levels=1:2 keys_zone=wms:20m max_size=500m inactive=1d use_temp_path=off;

map $arg_request $no_cachear {
  default   1;
  ~*^GetMap$ 0;
  ~*^GetLegendGraphic$ 0;
}

map $no_cachear $cache_navegador {
  0 "public, max-age=3600";
  1 "no-store";
}

server {
  listen 80;
  root /usr/share/nginx/html;
  # El navegador manda las cookies de otras apps en localhost (no se separan por puerto).
  large_client_header_buffers 4 64k;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/geo+json text/xml application/xml image/svg+xml;

  # Los archivos del build llevan hash en el nombre: se pueden cachear para siempre.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # WMS/WFS de solo lectura, sin credenciales.
  location /geoserver/ {
    proxy_pass http://geoserver:8080/geoserver/;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";

    proxy_cache wms;
    # Las teselas llegan por POST (el SLD va en el cuerpo); la clave usa la URL, que trae el hash del estilo.
    proxy_cache_methods GET HEAD POST;
    proxy_cache_bypass $no_cachear;
    proxy_no_cache $no_cachear;
    proxy_cache_valid 200 1h;
    proxy_cache_lock on;
    add_header X-Cache $upstream_cache_status;
    # Después de una obra nueva el visor agrega un parámetro, así que la tesela cambia de clave.
    add_header Cache-Control $cache_navegador always;
  }

  # WFS-T: el proxy agrega las credenciales del editor para que no queden en el navegador.
  # ZWRpdG9yOmVkaXRvcg== es base64 de "editor:editor" (GEOSERVER_EDITOR_USER/PASSWORD del .env).
  location = /wfst {
    limit_except POST { deny all; }
    proxy_pass http://geoserver:8080/geoserver/tpi/wfs;
    proxy_set_header Authorization "Basic ZWRpdG9yOmVkaXRvcg==";
    proxy_set_header Cookie "";
  }
}
